[package]
name = "sentinel-reporter"
version = "0.1.0"
edition = "2021"
authors = ["VQ-Capital Team"]
description = "Real-time training audit reporter for VQ-CAPITAL HFT Optimizer"
rust-version = "1.75"

[dependencies]
tokio = { version = "1.37", features = ["full", "rt-multi-thread", "signal"] }
notify = "6.1"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Optional dashboard dependencies
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["fs", "cors"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }

[features]
default = ["dashboard"]
dashboard = ["axum", "tower", "tower-http", "tokio-stream"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
